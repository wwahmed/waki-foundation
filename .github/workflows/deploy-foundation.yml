name: deploy-foundation

# Auto-deploy the foundation to two Cloudflare Pages projects on every push to main:
#   - tokens/app/dist                         -> waki-themes-studio (themes.wakilabs.dev)
#   - site/ = cdn/ + tokens/dist/cdn overlay  -> wakilabs-cdn       (cdn.wakilabs.dev)
# The CDN site is assembled from cdn/ (landing, headers, installers, shell bundles) plus the freshly
# built waki-themes bundle, so a themes deploy no longer drops the other artifacts.
#
# Both Pages projects are Direct Upload type. This workflow is the deploy
# mechanism. Root has no npm deps; the studio app has its own lockfile under
# `app/`. Build sequence: bundle -> studio.
#
# Speed optimizations:
#   - paths filter limits triggers to source code, build scripts, and the
#     workflow itself.
#   - npm cache + Vite cache shave most of the build time off warm runs.
#   - concurrency.cancel-in-progress cancels older runs mid-deploy when a
#     newer push lands.

on:
  push:
    branches: [main]
    paths:
      - "tokens/src/themes/**"
      - "tokens/styles/**"
      - "tokens/family/**"
      - "tokens/dist/family.json"
      - "tokens/scripts/**"
      - "tokens/app/**"
      - "tokens/package.json"
      - "tokens/package-lock.json"
      - "cdn/**"
      - "packages/shell-web/dist/**"
      - ".github/workflows/deploy-foundation.yml"
      - ".github/scripts/append-changelog.mjs"
  workflow_dispatch: {}

concurrency:
  group: deploy-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tokens/app/package-lock.json

      - name: Cache Vite build outputs (studio)
        uses: actions/cache@v4
        with:
          path: |
            tokens/app/node_modules/.vite
            tokens/app/.vite-cache
          key: vite-studio-${{ hashFiles('tokens/app/package-lock.json', 'tokens/app/vite.config.ts') }}-${{ hashFiles('tokens/app/src/**/*', 'tokens/src/themes/**/*', 'tokens/styles/**/*') }}
          restore-keys: |
            vite-studio-${{ hashFiles('tokens/app/package-lock.json', 'tokens/app/vite.config.ts') }}-
            vite-studio-

      - name: Build bundle (root, no deps; node-only)
        working-directory: tokens
        run: node scripts/build-bundle.mjs

      - name: Shape Foundation CDN bundle
        working-directory: tokens
        run: node scripts/build-cdn.mjs

      - name: Install studio deps
        working-directory: tokens/app
        run: npm ci --prefer-offline --no-audit

      - name: Sync bundle into studio + build studio
        working-directory: tokens/app
        run: |
          npm run sync-bundle
          npm run build

      - name: Append changelog entry from commit message
        # Studio surface only; CDN at cdn.wakilabs.dev intentionally has
        # no changelog (it's a machine-readable artifact endpoint).
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          CHANGELOG_LIVE_URL: https://themes.wakilabs.dev/changelog.json
          CHANGELOG_DIST_PATH: tokens/app/dist/changelog.json
          PACKAGE_JSON_PATH: tokens/app/package.json
        run: node .github/scripts/append-changelog.mjs

      - name: Bundle size summary
        working-directory: tokens
        # Workflow-only bundle telemetry. Captures size of both shipped
        # surfaces (studio app + cdn bundle) so regressions show up in
        # the run summary plus the artifact archive.
        run: |
          {
            echo "# waki-themes bundle (sha ${GITHUB_SHA::7})"
            echo
            echo "## Studio (app/dist)"
            echo
            echo '```'
            du -sh app/dist
            (cd app/dist && find . -type f -printf '%s %p\n' 2>/dev/null \
              || find app/dist -type f -exec stat -f '%z %N' {} \;) \
              | sort -rn | head -20
            echo '```'
            echo
            echo "## CDN (dist/cdn)"
            echo
            echo '```'
            du -sh dist/cdn
            (cd dist/cdn && find . -type f -printf '%s %p\n' 2>/dev/null \
              || find dist/cdn -type f -exec stat -f '%z %N' {} \;) \
              | sort -rn | head -20
            echo '```'
          } > dist-stats.md
          cat dist-stats.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle stats artifact
        uses: actions/upload-artifact@v4
        with:
          name: waki-themes-bundle-stats-${{ github.sha }}
          path: tokens/dist-stats.md
          retention-days: 30
          if-no-files-found: warn

      - name: Deploy app/dist to waki-themes-studio (themes.wakilabs.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf "%s" "$COMMIT_SUBJECT" | head -1 | tr -d '\r')
          npx --yes wrangler@4 pages deploy tokens/app/dist \
            --project-name=waki-themes-studio \
            --branch=main \
            --commit-dirty=true \
            --commit-hash=${{ github.sha }} \
            --commit-message="$SUBJECT"

      - name: Assemble the CDN site (cdn/ + fresh waki-themes bundle)
        run: |
          mkdir -p site
          # cdn/waki-ai-service (retired installer pipeline) and cdn/waki-shell are NOT deployed: neither has been
          # live since the last themes deploy, and serving them would change what clients receive. Re-enable
          # deliberately (remove the exclude) when the shell or an installer should go live.
          rsync -a --exclude '.wakilabs' --exclude 'AGENTS.md' --exclude 'CLAUDE.md' --exclude 'README.md' \
            --exclude 'docs' --exclude '.gitignore' --exclude 'waki-ai-service' --exclude 'waki-shell' cdn/ site/
          rsync -a tokens/dist/cdn/ site/
          find site -maxdepth 2 | sort | head -40

      - name: Deploy dist/cdn to wakilabs-cdn (cdn.wakilabs.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf "%s" "$COMMIT_SUBJECT" | head -1 | tr -d '\r')
          npx --yes wrangler@4 pages deploy site \
            --project-name=wakilabs-cdn \
            --branch=main \
            --commit-dirty=true \
            --commit-hash=${{ github.sha }} \
            --commit-message="$SUBJECT"
