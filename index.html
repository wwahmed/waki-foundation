<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Wakilabs CDN</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a1f2e 0%, #0a0d14 100%);
      color: #e6e9ef;
    }
    .card {
      max-width: 540px;
      padding: 32px 36px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
    p { margin: 0 0 16px; color: #b0b6c1; }
    code {
      font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      color: #c8cdd6;
    }
    ul { padding-left: 20px; margin: 0; color: #b0b6c1; }
    li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wakilabs CDN</h1>
    <p>Foundation artifact publishing point. Anonymous public read; aggressive edge cache.</p>
    <p>Layout:</p>
    <ul>
      <li><code>/waki-themes/</code> theme bundles + dist</li>
      <li><code>/waki-shell/</code> shell bundles + dist (future)</li>
    </ul>
    <p>See <code>~/workspaces/waki-homelab/projects/foundation-hosting-migration.md</code> for the publishing flow.</p>
  </div>
</body>
</html>
